services:
  # 1. Django REST Backend with MongoDB
  - type: web
    name: freightiq-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: MONGODB_URI
        value: "mongodb+srv://dbuser:dbuser1234@cluster0.awyoltz.mongodb.net/freightiq?retryWrites=true&w=majority&appName=Cluster0"
      - key: MONGODB_DB_NAME
        value: "freightiq"

  # 2. React / Vite Frontend
  - type: web
    name: freightiq-frontend
    env: static
    rootDir: client
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
